<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POOR DJ — prueba</title>
<style>body{background:#121212;color:white;font-family:Arial;margin:0;padding:16px}main{max-width:600px;margin:auto}</style><main></main><script>
const events=new Map(),storage=new Map(),timers=new Set(),nativeInterval=window.setInterval,nativeClear=window.clearInterval;
window.setInterval=(...args)=>{const id=nativeInterval(...args);timers.add(id);return id;};window.clearInterval=id=>{timers.delete(id);nativeClear(id);};
const make=i=>({uri:'spotify:track:'+String(i).padStart(22,'0'),name:'Demo '+i,artists:[{name:i===90?'Isma':'Omar Courtz',uri:'spotify:artist:'+String(i===90?4:1).padStart(22,'0')}],duration_ms:200000});
const tracks=Array.from({length:30},(_,i)=>make(i+2));tracks.push({...make(90),name:'SIN UN PLAN (TEGOCALDERON)',artists:[{name:'Isma',uri:'spotify:artist:'+String(4).padStart(22,'0')}]});let serial=0,volume=.6,playing=true,progress=10000;
const row=(t,provider='queue')=>({contextTrack:{...t,uid:'q'+serial++},provider});
window.demo={intervals:()=>timers.size,listeners:()=>[...events.values()].reduce((n,a)=>n+a.length,0),pause:()=>{playing=false;(events.get('onplaypause')||[]).forEach(fn=>fn());}};
window.Spicetify={Queue:{nextTracks:tracks.slice(0,30).map(t=>row(t,'context'))},Platform:{LocalStorageAPI:{getItem:k=>storage.get(k),setItem:(k,v)=>storage.set(k,v)},PlayerAPI:{play:function(t){t=tracks.find(x=>x.uri===t.uri)||make(Number(t.uri.slice(-2)));window.demo.beforeManualPlay=Spicetify.Queue.nextTracks.filter(t=>t.provider==='queue').length;Spicetify.Player.data.item=t;(events.get('songchange')||[]).forEach(fn=>fn());return 'played';}},History:{push:()=>{}},ConnectAPI:{getState:()=>({activeDevice:{isLocal:true,id:'local'}})},SettingsAPI:{playback:{audioCrossfade:{value:false},autoMix:{value:false}}}},
Player:{data:{item:make(1),context:{uri:'spotify:playlist:0000000000000000000001'},restrictions:{canSkipNext:true}},origin:{_queue:{addToQueue:()=>{}}},getProgress:()=>progress,getDuration:()=>200000,isPlaying:()=>playing,getVolume:()=>volume,setVolume:v=>volume=v,getMute:()=>false,getRepeat:()=>0,next:()=>{},addEventListener:(k,fn)=>events.set(k,[...(events.get(k)||[]),fn]),removeEventListener:(k,fn)=>events.set(k,(events.get(k)||[]).filter(f=>f!==fn))},
Playbar:{Button:class{deregister(){}}},PopupModal:{display:({content})=>document.querySelector('main').replaceChildren(content),hide:()=>document.querySelector('main').replaceChildren()},GraphQL:{Definitions:{},Request:async()=>({tracks})},CosmosAsync:{get:async()=>({tracks})},getAudioData:async()=>({track:{tempo:120,key:0,mode:1}}),
addToQueue:async ts=>Spicetify.Queue.nextTracks.push(...ts.map(t=>row(tracks.find(x=>x.uri===t.uri)||make(Number(t.uri.slice(-2)))))),removeFromQueue:async ts=>Spicetify.Queue.nextTracks=Spicetify.Queue.nextTracks.filter(t=>!ts.some(x=>x.uid===t.contextTrack.uid))};
if(!new URLSearchParams(location.search).has('fresh'))storage.set('poor-dj-v2',{settings:{discovery:90,diversity:90,queueSize:5,takeover:true,transition:'fixed'},memory:{},preferences:{}});window.demo.originalPlay=Spicetify.Platform.PlayerAPI.play;
document.addEventListener('click',event=>{const panel=document.querySelector('.pd');if(panel && !panel.contains(event.target))Spicetify.PopupModal.hide();});
</script><script src="../poor-mans-dj.js"></script><script>PoorDJ.open();</script></html>
