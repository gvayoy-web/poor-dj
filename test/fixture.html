<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POOR DJ — prueba</title>
<style>
  body { background: #121212; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif; margin: 0; }
  #main-view { position: fixed; inset: 0 0 72px 0; overflow: hidden; }
  [data-testid="now-playing-bar"] { position: fixed; left: 0; right: 0; bottom: 0; height: 72px; background: #000; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 18px; }
  .demo-qbtn { background: transparent; border: 0; color: #b3b3b3; padding: 6px; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
</style>
<div id="main-view"></div>
<footer data-testid="now-playing-bar">
  <button type="button" class="demo-qbtn" data-testid="control-button-queue" aria-label="Cola">≡</button>
</footer>
<script>
const events = new Map();
const storage = new Map();
const timers = new Set();
const nativeInterval = window.setInterval;
const nativeClear = window.clearInterval;
window.setInterval = (...args) => {
  const id = nativeInterval(...args);
  timers.add(id);
  return id;
};
window.clearInterval = id => {
  timers.delete(id);
  nativeClear(id);
};

const make = i => ({
  uri: 'spotify:track:' + String(i).padStart(22, '0'),
  name: 'Demo ' + i,
  artists: [{ name: i === 90 ? 'Isma' : 'Artist ' + ((i % 4) + 1), uri: 'spotify:artist:' + String(i === 90 ? 4 : (i % 4) + 1).padStart(22, '0') }],
  duration_ms: 200000
});
const tracks = Array.from({ length: 30 }, (_, i) => make(i + 2));
tracks.push({
  ...make(90),
  name: 'SIN UN PLAN (TEGOCALDERON)',
  artists: [{ name: 'Isma', uri: 'spotify:artist:' + String(4).padStart(22, '0') }]
});
let serial = 0;
let volume = 0.6;
let playing = true;
let progress = 10000;
const row = (t, provider = 'queue') => ({ contextTrack: { ...t, uid: 'q' + serial++ }, provider });

window.demo = {
  intervals: () => timers.size,
  listeners: () => [...events.values()].reduce((n, a) => n + a.length, 0),
  pause: () => {
    playing = false;
    (events.get('onplaypause') || []).forEach(fn => fn());
  }
};

window.Spicetify = {
  Queue: { nextTracks: tracks.slice(0, 30).map(t => row(t, 'context')) },
  Platform: {
    LocalStorageAPI: { getItem: k => storage.get(k), setItem: (k, v) => storage.set(k, v) },
    PlayerAPI: {
      play: function (t) {
        t = tracks.find(x => x.uri === t.uri) || make(Number(t.uri.slice(-2)));
        window.demo.beforeManualPlay = Spicetify.Queue.nextTracks.filter(x => x.provider === 'queue').length;
        Spicetify.Player.data.item = t;
        (events.get('songchange') || []).forEach(fn => fn());
        return 'played';
      }
    },
    History: {
      location: { pathname: '/' },
      listeners: [],
      push(p) {
        this.location = { pathname: p };
        this.listeners.forEach(fn => fn(this.location));
      },
      goBack() {
        this.push('/');
      },
      listen(fn) {
        this.listeners.push(fn);
        return () => {
          this.listeners = this.listeners.filter(x => x !== fn);
        };
      }
    },
    ConnectAPI: { getState: () => ({ activeDevice: { isLocal: true, id: 'local' } }) },
    SettingsAPI: { playback: { audioCrossfade: { value: false }, autoMix: { value: false } } }
  },
  Player: {
    data: { item: make(1), context: { uri: 'spotify:playlist:0000000000000000000001' }, restrictions: { canSkipNext: true } },
    origin: { _queue: { addToQueue: () => {} } },
    getProgress: () => progress,
    seek: ms => {
      progress = ms;
      window.demo.seeked = ms;
    },
    togglePlay: () => {
      playing = !playing;
    },
    back: () => {},
    getDuration: () => 200000,
    isPlaying: () => playing,
    getVolume: () => volume,
    setVolume: v => {
      volume = v;
    },
    getMute: () => false,
    getRepeat: () => 0,
    next: () => {},
    addEventListener: (k, fn) => events.set(k, [...(events.get(k) || []), fn]),
    removeEventListener: (k, fn) => events.set(k, (events.get(k) || []).filter(f => f !== fn))
  },
  Playbar: {
    Button: class {
      constructor(name, icon, fn) {
        window.demo.buttons = (window.demo.buttons || []).concat({ name, fn });
      }
      deregister() {}
    }
  },
  GraphQL: {
    Definitions: {},
    Request: async () => ({ tracks })
  },
  CosmosAsync: {
    get: async url => {
      if (String(url).includes('color-lyrics')) {
        window.demo.lyricsCalls = (window.demo.lyricsCalls || 0) + 1;
        return {
          lyrics: {
            syncType: 'LINE_SYNCED',
            language: 'es',
            providerDisplayName: 'Demo',
            lines: [
              { startTimeMs: '0', words: 'Primera línea' },
              { startTimeMs: '8000', words: 'Segunda línea' },
              { startTimeMs: '12000', words: 'Tercera línea' },
              { startTimeMs: '20000', words: '♪' }
            ]
          }
        };
      }
      if (String(url).includes('inspiredby-mix')) {
        return { mediaItems: [] };
      }
      if (String(url).includes('radio-apollo')) {
        return { tracks: tracks.slice(10, 20), related_artists: [] };
      }
      return { tracks };
    }
  },
  getAudioData: async () => ({ track: { tempo: 120, key: 0, mode: 1, loudness: -8 } }),
  addToQueue: async ts => Spicetify.Queue.nextTracks.push(...ts.map(t => row(tracks.find(x => x.uri === t.uri) || make(Number(t.uri.slice(-2)))))),
  removeFromQueue: async ts => {
    Spicetify.Queue.nextTracks = Spicetify.Queue.nextTracks.filter(t => !ts.some(x => x.uid === t.contextTrack.uid));
  }
};

if (!new URLSearchParams(location.search).has('fresh')) {
  storage.set('poor-dj-v2', { settings: { discovery: 90, diversity: 90, queueSize: 5, takeover: true, transition: 'fixed' }, memory: {}, preferences: {} });
}
window.demo.originalPlay = Spicetify.Platform.PlayerAPI.play;
</script>
<script src="../poor-mans-dj.js"></script>
<script>PoorDJ.open();</script>
</html>
